<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Daedalus Data Explorer</title>
    <base href="/"/>
    <link
        href="_content/Radzen.Blazor/css/material-base.css"
        rel="stylesheet"
    />
    <link href="css/daedalus-theme.css" rel="stylesheet"/>
    <link href="app.css" rel="stylesheet"/>
    <link href="Daedalus.Web.styles.css" rel="stylesheet"/>
    <link href="favicon.svg" rel="icon" type="image/svg+xml"/>
</head>

<body>
<div id="app">
    <div class="app-loading">
        <p class="app-loading-name">Daedalus</p>
        <div class="app-loading-indicator" role="progressbar" aria-label="Loading Daedalus"></div>
    </div>
</div>

<style>
    /* The loading screen centres itself, not #app: a centring #app would shrink the app's layout to its content
       once it renders, so the content column's width would change from page to page. It is the page as the app
       paints it, the body background, with the product name and a progress indicator in the primary colour, as
       Radzen's circular progress bar draws it. Its colours are Radzen tokens: material-base.css and the theme are
       stylesheets in the head, which block rendering, so the tokens are defined before this screen paints. */
    .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        height: 100vh;
        background-color: var(--rz-body-background-color);
        color: var(--rz-text-title-color);
        font-family: var(--rz-text-font-family);
    }
    .app-loading-name {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
    }
    .app-loading-indicator {
        width: 48px;
        height: 48px;
        border: 4px solid var(--rz-base-200);
        border-top-color: var(--rz-primary);
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
    }
    @keyframes app-spin {
        to { transform: rotate(360deg); }
    }
</style>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href="">Reload</a>
    <a class="dismiss">🗙</a>
</div>

<script>
    // MainLayout reads the viewport's width before its first render, so the menu starts in the state the width gives:
    // closed below 1280px, open from it.
    window.daedalusViewportWidth = () => window.innerWidth;
</script>
<script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
<script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
