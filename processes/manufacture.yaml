# The first real manufacturing process. A transcription of subagent-driven-development's control
# flow — implement, review with a bounded fix loop, a human approval gate, then publish — expressed
# as data the engine interprets rather than as a skill's prose.
#
# Three constraints shape this file:
#
#   1. `implement` writes to the working tree. Phase 2.2 shipped this node read-only: its skill
#      produced a *description* of a change and made none, so the pipeline could reach `succeeded`
#      with zero code changed and `review` had only prose to read. The project owner reversed that on
#      2026-09-23 - see docs/plans/2026-09-23-phase-2.3-manufacturing-squad-design.md section 4.1.
#
#      What the implementer can actually write is NARROWER than "it edits code", and section 4.1
#      records the narrowing after the tool was checked rather than assumed. `roslyn__apply_code_action`
#      applies a refactoring or fix that Roslyn ALREADY OFFERS at a position, named by its title out
#      of `roslyn__get_code_actions`' list for that position, and it DEFAULTS TO `preview: true` -
#      returning a diff and writing nothing unless the call passes `preview: false`. So the node
#      cannot author new code or create a file, and a call that omits `preview: false` leaves the
#      tree untouched while still returning successfully. skills/manufacture-implement/SKILL.md
#      shows the call with the argument and says what omitting it does, because an implementer that
#      followed the older wording would report `changed` against an unmodified tree and every
#      control below would then operate correctly on nothing.
#
#      The write envelope did NOT widen with it. The `implementer` agent's configured `Tools` list
#      names `roslyn__*`, `daedalus__*`, `memory__*`, `skills__*` and `context7__*` and nothing else:
#      no `git__*` and no `repoaction__*` entry appears in it, so neither family is ever offered to
#      one of its turns. It edits files; it cannot branch, commit, push, or open a pull request.
#      That is tool ABSENCE, not a policy denial - the `git__*` -> developer binding in
#      Thalos:ToolPolicies is a second, independent line that would also deny the call, but it is
#      never reached, because the tool is not in the list to be called.
#
#      Consequence, stated plainly because nothing in this file undoes it: a run LEAVES UNCOMMITTED
#      CHANGES BEHIND. A rejected review, a `maxVisits` redirect to `adjudicate`, a failed run and a
#      stranded run all leave the tree modified, and with `maxVisits: 5` up to five rounds of edits
#      can pile up on each other. Deciding what to do with them is a human step.
#
#   2. `publish` still cannot open a pull request, and this is unchanged from phase 2.2. A run
#      executes as WorkflowCaller, whose only role is "workflow"; `git__*` and `repoaction__*` are
#      bound to the `developer` policy, which that role fails. So `publish` never attempts a git or
#      repo-action tool call - it writes a memory__remember record and reports `published` through
#      its own outcome tool. That call is the only thing enforced structurally; it does not prove
#      the record's content is real, or that a human ever reads it. Opening the actual pull request
#      stays a deliberately unautomated, human-triggered step.
#
#   3. Reaching `succeeded` proves the graph walked implement -> review -> retrospect -> gate ->
#      publish -> done and that each task node's agent called the outcome tool its schema demanded.
#      Phase 2.3 narrows what that leaves unproven - `implement` must now assert `changed` rather than
#      complete on any output at all, and `review` must survive three lenses and produce evidence -
#      but it does not close the gap. See section 12 of the design document for the honest limits.
process: manufacture
# version bumped 2 -> 3 (phase 2.3, task B4): implement and review move onto the squad roles, implement
# gains an outcome set, and review declares its lenses. Content-hash immutability refuses a same-version
# content change, so all three ride one bump - a second bump inside one change would be refused.
#
# version bumped 3 -> 4 (phase 2.3, final review finding 1): the constraint-1 comment above claimed the
# implementer "applies changes through roslyn__apply_code_action" without either narrowing it to a
# Roslyn-offered action or naming the `preview: false` argument the tool needs before it writes anything.
# The graph is unchanged by this bump; the comment is not, and the same content-hash immutability rule
# that forced one bump for three graph changes forces this one for a comment-only change. Bumping is the
# rule working, not an obstacle to route around: a v3 body that no longer matches v3's stored hash is a
# file the store refuses to activate, leaving the old v3 running and the correction never reaching a run.
#
# version bumped 4 -> 5 (phase 2.4, task B4): review's `approved` outcome no longer branches straight to the
# human gate. It branches to a new `retrospect` node first, which runs as `reviewer` - the same agent that holds
# no write tool - and sees only the implementer's `learnings` plus the pinned standing instructions, never the
# implementer's `summary` or `rationale`. It PROPOSES a replacement for the standing instructions file; nothing
# in this graph writes it. Both of retrospect's outcomes, `proposed` and `none`, still branch to `gate`, so a
# human approval is required either way and the proposal only ever reaches disk through B5's apply step, on a
# human's resume. This ports Ralph's AGENT.md self-improvement loop into the workflow - see the phase 2.4
# design, amendment D4. Content-hash immutability forces the graph edit and this comment to ride one bump.
version: 5

nodes:
  # `outcomes` is new in version 3. Version 2 declared none, so this node completed on any turn output
  # at all - tolerable while it only wrote a description, not tolerable now it modifies a working tree.
  # `changed` is an explicit claim that the tree was edited, and it is the ONLY edge into `review`: the
  # reviewer is never dispatched except behind an assertion that there is something to read. `blocked`
  # exists so that claim costs something - with `changed` as the only way out of the node, an agent that
  # edited nothing would still assert it to escape, and the claim would mean nothing. A run that changed
  # no code did not manufacture anything, so `blocked` ends it rather than advancing it.
  implement:
    agent: implementer
    skill: manufacture-implement
    outcomes: [changed, blocked]
    branch:
      changed: review
      blocked: adjudicate

  # `lenses` was parsed and left inert by phase 2.2's loader. Daedalus' ReviewLensRunner reads it: the
  # node runs one agent turn per lens, in this order, and stops at the first rejection - so a rejection
  # costs one pass and an approval costs three. This is a host-side dispatch concern, not an engine
  # change; the engine's invariant is one TRANSITION per transaction, not one turn per node.
  review:
    agent: reviewer
    skill: manufacture-review
    outcomes: [approved, rejected]
    branch:
      approved: retrospect
      rejected: implement
    maxVisits: 5
    onExceeded: adjudicate
    lenses: [correctness, falsifiability, mechanism]

  # The standing-instructions loop, ported from Ralph's AGENT.md maintenance. Runs as `reviewer`, which holds no
  # write tool, and sees only the implementer's `learnings` plus the pinned standing instructions - never its summary
  # or rationale. It PROPOSES; nothing here writes AGENT.md. The proposal rides the gate below, and only a human
  # resuming with applyStandingInstructions writes it, in host code. See the phase 2.4 design, D4.
  retrospect:
    agent: reviewer
    skill: manufacture-retrospect
    outcomes: [proposed, none]
    branch:
      proposed: gate
      none: gate

  # A terminal, not a human escalation. subagent-driven-development's own breaker sends a
  # tripped loop to a human; this node just ends the run as failed instead. A faithful
  # transcription would make this a second `human_approval`-style gate, which this phase does
  # not build — naming the gap here rather than calling a dead end "adjudication."
  adjudicate:
    terminal: failed

  gate:
    await: human_approval
    next: publish

  publish:
    agent: Daedalus Architect
    skill: manufacture-publish
    outcomes: [published]
    branch:
      published: done

  done:
    terminal: succeeded
