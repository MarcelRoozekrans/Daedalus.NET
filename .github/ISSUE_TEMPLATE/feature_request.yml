name: Feature Request
description: Suggest an enhancement or new feature for Daedalus
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Daedalus? Describe the problem you're solving and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the motivation?
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. Be as specific as possible.
    validations:
      required: true

  - type: dropdown
    id: components
    attributes:
      label: Affected Components
      description: Which parts of the system would this feature touch?
      multiple: true
      options:
        - Domain Layer
        - Application Layer
        - Infrastructure Layer
        - API (Daedalus.Api)
        - Console Worker (Daedalus.Console)
        - Web Frontend (Blazor)
        - Database / Migrations
        - CI/CD Pipeline
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, code snippets, or references.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Before Submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
