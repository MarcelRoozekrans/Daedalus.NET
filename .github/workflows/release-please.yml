name: Release Please

# The release half of the versioning design (the derivation half is GitVersion — see GitVersion.yml):
# release-please reads the conventional commits since the last release, opens a pull request
# proposing the version they imply, and — when that PR is merged and this workflow is dispatched
# again — creates the GitHub release and the vX.Y.Z tag. That tag is the release gate: on the tagged
# commit GitVersion returns the tag's version, and the publish-release job in ci.yml refuses any
# commit that is not tagged v<version> — there are no prereleases, so the tag is the only thing that
# marks a commit as released. The maintainer merges the release PR, like every PR here — this
# workflow only proposes.
#
# Manual dispatch only, deliberately: a workflow that opened a release PR on every push to main
# would be proposing a release nobody asked for. Procedure: docs/release.md.
on:
  workflow_dispatch:

# release-please writes: the release PR (contents for the branch, pull-requests for the PR) and, on
# the dispatch after that PR merges, the tag and the GitHub release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Everything is read from release-please-config.json and .release-please-manifest.json. Pass no
      # release-type input here: with one, the action ignores the config file, so bump-minor-pre-major
      # is lost and a breaking change on 0.x jumps to 1.0.0. The config sets release-type simple: the
      # release PR maintains CHANGELOG.md and a version.txt; nothing in the build consumes either,
      # since GitVersion derives the build's version from the tag this creates. bump-minor-pre-major
      # keeps a breaking change on 0.x at a minor bump, and bump-patch-for-minor-pre-major keeps a
      # feature at a patch. The manifest records the last released version. A version can still be
      # chosen with a `Release-As: x.y.z` footer on an empty commit (docs/release.md).
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
