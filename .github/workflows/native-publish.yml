name: Native publish

# Publishes the server targets with Native AOT and uploads the binaries, so a native run can happen
# without publishing on the shared development VM, where ILC runs out of memory. It runs on a pull
# request that carries the `native-publish` label: adding the label starts it, and every later push
# to that pull request publishes again until the label is removed. The warning counts stay with the
# CI workflow's aot-analysis job; this workflow only produces runnable binaries.

on:
  pull_request:
    branches: [main]
    types: [labeled, opened, reopened, synchronize]

# Adding any other label to the pull request also raises a `labeled` event. That run does nothing, and it gets
# a group of its own: workflow-level concurrency is applied before any job's `if`, so in the shared group it
# would cancel a publish already running.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'native-publish')
    && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  native-publish:
    name: Native publish (${{ matrix.target }})
    if: >-
      contains(github.event.pull_request.labels.*.name, 'native-publish')
      && (github.event.action != 'labeled' || github.event.label.name == 'native-publish')
    # Pinned, not ubuntu-latest: a native binary needs the glibc it was linked against or newer. ubuntu-latest
    # moved to 26.04, glibc 2.43, which neither this VM nor the .NET 10 images, Ubuntu 24.04 with 2.39, have.
    runs-on: ubuntu-26.04
    # The Api publish compiles the whole program natively, about 21 minutes on the agent VM.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [Api, Cli, Migrations]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-aot-${{ runner.os }}-

      # The aot-analysis job's publish command, with an output directory. Warnings do not fail the
      # publish here: counting them is the aot-analysis job's work.
      - name: Publish with Native AOT
        run: >
          dotnet publish src/Daedalus.${{ matrix.target }} -c Release -r linux-x64 -p:PublishAot=true
          -p:TreatWarningsAsErrors=false -p:WarningsAsErrors= -o "${{ runner.temp }}/native/${{ matrix.target }}"
          -tl:off

      # The .dbg symbol files are several times the binary's size and a run does not need them.
      - name: Drop the debug symbols
        run: find "${{ runner.temp }}/native/${{ matrix.target }}" -name '*.dbg' -delete

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: error
          # .mcp.json is part of the CLI's and the API's publish output, and upload-artifact skips dotfiles
          # by default. Without it a run treats the file as absent and never parses it.
          include-hidden-files: true

  # Runs Playwright.Api against the Api composition published with Native AOT, then checks that the production
  # Api binary starts. The suite needs no browser: Playwright.Api is plain HTTP, so no Playwright install.
  native-suites:
    name: Native suites
    needs: native-publish
    if: >-
      contains(github.event.pull_request.labels.*.name, 'native-publish')
      && (github.event.action != 'labeled' || github.event.label.name == 'native-publish')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DB_NAME: daedalus_native
      DB_USER: native_user
      DB_PASSWORD: native_password
      HOST_PORT: 5081
      PROD_PORT: 5082

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: daedalus_native
          POSTGRES_USER: native_user
          POSTGRES_PASSWORD: native_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U native_user -d daedalus_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-aot-${{ runner.os }}-

      - name: Download the native Migrations binary
        uses: actions/download-artifact@v8
        with:
          name: native-Migrations
          path: ${{ runner.temp }}/native/Migrations

      - name: Download the native Api binary
        uses: actions/download-artifact@v8
        with:
          name: native-Api
          path: ${{ runner.temp }}/native/Api

      # The host applies no migrations: Playwright.Api in external mode only seeds test data.
      - name: Migrate the database with the native Migrations binary
        run: |
          chmod +x "${{ runner.temp }}/native/Migrations/Daedalus.Migrations"
          cd "${{ runner.temp }}/native/Migrations"
          ./Daedalus.Migrations
        env:
          ConnectionStrings__daedalus: Host=localhost;Port=5432;Database=${{ env.DB_NAME }};Username=${{ env.DB_USER }};Password=${{ env.DB_PASSWORD }}

      # Same command as the publish job, for the test host. Warnings do not fail it here.
      - name: Publish the test host with Native AOT
        run: >
          dotnet publish tests/Daedalus.Tests.NativeApiHost -c Release -r linux-x64 -p:PublishAot=true
          -p:TreatWarningsAsErrors=false -p:WarningsAsErrors= -o "${{ runner.temp }}/native/NativeApiHost"
          -tl:off 2>&1 | tee "${{ runner.temp }}/publish-host.log"

      - name: Start the native test host
        run: |
          dir="${{ runner.temp }}/native/NativeApiHost"
          chmod +x "$dir/Daedalus.Tests.NativeApiHost"
          cd "$dir"
          nohup ./Daedalus.Tests.NativeApiHost > "${{ runner.temp }}/host.log" 2>&1 &
          echo $! > "${{ runner.temp }}/host.pid"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$HOST_PORT/health" > /dev/null 2>&1; then
              echo "Host answered /health after $i attempts"
              exit 0
            fi
            if ! kill -0 "$(cat "${{ runner.temp }}/host.pid")" 2>/dev/null; then
              echo "::error::The native test host exited before answering /health"
              tail -n 100 "${{ runner.temp }}/host.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::The native test host did not answer /health within 120 seconds"
          tail -n 100 "${{ runner.temp }}/host.log"
          exit 1
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5081
          ASPNETCORE_ENVIRONMENT: Development
          E2E_CONNECTION_STRING: Host=localhost;Port=5432;Database=${{ env.DB_NAME }};Username=${{ env.DB_USER }};Password=${{ env.DB_PASSWORD }}

      - name: Run Playwright.Api against the native host
        run: >
          dotnet test tests/Daedalus.Tests.Playwright.Api -c Release -tl:off
          --logger "trx;LogFileName=playwright-api-native.trx" --results-directory "${{ runner.temp }}/test-results"
        env:
          E2E_BASE_URL: http://127.0.0.1:5081
          E2E_CONNECTION_STRING: Host=localhost;Port=5432;Database=${{ env.DB_NAME }};Username=${{ env.DB_USER }};Password=${{ env.DB_PASSWORD }}

      - name: Show the end of the host log
        if: failure()
        run: tail -n 100 "${{ runner.temp }}/host.log" || true

      - name: Stop the native test host
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/host.pid" ]; then kill "$(cat "${{ runner.temp }}/host.pid")" 2>/dev/null || true; fi

      # The production binary check. It accepts 200 or 503 from /health: this Development composition has no
      # Keycloak in CI, so a dependency check may report unhealthy. What it proves is that the native binary
      # starts, binds its port, applies no migration of its own and serves a request after the Migrations run.
      # It does not run suites against it.
      - name: Check that the production Api binary starts and serves
        run: |
          dir="${{ runner.temp }}/native/Api"
          chmod +x "$dir/Daedalus.Api"
          cd "$dir"
          nohup ./Daedalus.Api > "${{ runner.temp }}/api.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PROD_PORT/health" || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Production Api answered /health with $code after $i attempts"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::The production Api exited before answering /health"
              tail -n 100 "${{ runner.temp }}/api.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::The production Api did not answer /health within 120 seconds, last status $code"
          tail -n 100 "${{ runner.temp }}/api.log"
          exit 1
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5082
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__daedalus: Host=localhost;Port=5432;Database=${{ env.DB_NAME }};Username=${{ env.DB_USER }};Password=${{ env.DB_PASSWORD }}

      - name: Upload the logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-suites-logs
          path: |
            ${{ runner.temp }}/host.log
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/publish-host.log
            ${{ runner.temp }}/test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  # Phase 3.6 measurements: the eng/measure scripts, unchanged, against the native Api and sandbox images
  # and the native CLI binary. The numbers go into docs/plans/2026-11-11-phase-3.6-measurements.md beside the
  # phase 3.1 JIT baseline. The images are built here, on the Dockerfiles that ship, so the digest is the one measured.
  measure:
    name: Measure
    needs: native-publish
    if: >-
      contains(github.event.pull_request.labels.*.name, 'native-publish')
      && (github.event.action != 'labeled' || github.event.label.name == 'native-publish')
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-aot-${{ runner.os }}-

      - name: Download the native CLI binary
        uses: actions/download-artifact@v8
        with:
          name: native-Cli
          path: ${{ runner.temp }}/native/Cli

      - name: Build the Api image
        run: docker build -f src/Daedalus.Api/Dockerfile -t daedalus-measure/api:native .

      - name: Build the sandbox image
        run: docker build -f src/Daedalus.Sandbox/Dockerfile -t daedalus-measure/sandbox:native .

      # One stack for the three scripts: MEASURE_KEEP_STACK leaves it running between them.
      - name: Measure the Api image
        run: eng/measure/measure-api.sh daedalus-measure/api:native > "${{ runner.temp }}/measure-api.json"
        env:
          MEASURE_KEEP_STACK: 1

      - name: Measure the sandbox image
        run: eng/measure/measure-sandbox.sh daedalus-measure/sandbox:native > "${{ runner.temp }}/measure-sandbox.json"

      - name: Measure the CLI
        run: |
          chmod +x "${{ runner.temp }}/native/Cli/Daedalus.Cli"
          eng/measure/measure-cli.sh "${{ runner.temp }}/native/Cli/Daedalus.Cli" > "${{ runner.temp }}/measure-cli.json"

      - name: Show the results
        if: always()
        run: |
          for f in api sandbox cli; do
            [ -f "${{ runner.temp }}/measure-$f.json" ] && cat "${{ runner.temp }}/measure-$f.json" || true
          done

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-measurements
          path: ${{ runner.temp }}/measure-*.json
          retention-days: 30
          if-no-files-found: warn
