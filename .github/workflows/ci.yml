name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/marcelroozekrans

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Daedalus.sln

      - name: Build
        run: dotnet build Daedalus.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test Daedalus.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName!~Playwright&FullyQualifiedName!~Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit \
            --logger "trx;LogFileName=unit-tests.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Run Integration Tests
        run: |
          dotnet test Daedalus.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~Integration&FullyQualifiedName!~Playwright" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Integration \
            --logger "trx;LogFileName=integration-tests.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"Cobertura;HtmlSummary;TextSummary;Badges" \
            -assemblyfilters:"-*.Tests*;-Daedalus.Benchmarks;-Daedalus.AppHost;-Daedalus.Migrations;-Daedalus.ServiceDefaults"

      - name: Extract Coverage Percentage
        id: coverage
        run: |
          SUMMARY=$(cat ./CoverageReport/Summary.txt)
          COVERAGE=$(echo "$SUMMARY" | grep -oP 'Line coverage: \K[\d.]+')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "### Code Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./CoverageReport/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 30

      - name: Update Coverage Badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: daedalus-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 0
          maxColorRange: 100

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: ./TestResults/**/*.trx
          reporter: dotnet-trx

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - image: daedalus-api
            dockerfile: src/Daedalus.Api/Dockerfile
          - image: daedalus-console
            dockerfile: src/Daedalus.Console/Dockerfile
          - image: daedalus-web
            dockerfile: src/Daedalus.Web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
