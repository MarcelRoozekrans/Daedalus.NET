name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch: re-run after a flake, or — with publish_release=true — the gated release push of
  # versioned container images. Defaulting false keeps an ordinary dispatch exactly what it was.
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Push the vX.Y.Z-tagged container images to ghcr.io (the release procedure; see docs/release.md)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/marcelroozekrans

jobs:
  # The version every job stamps into what it builds, derived once from history by GitVersion
  # (GitVersion.yml; the tool is pinned in .config/dotnet-tools.json). Main derives plain X.Y.Z (no
  # prereleases, by decision); the release commit tagged vX.Y.Z derives exactly X.Y.Z. The regex
  # guard is load-bearing: `-p:Version=` with an empty value would silently build the csproj default.
  version:
    name: Derive version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion derives the version from history and refuses a shallow clone.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Derive the version
        id: derive
        shell: bash
        run: |
          dotnet tool restore
          version=$(dotnet dotnet-gitversion /output json | jq -r '.SemVer')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::GitVersion produced '$version', which is not a version — failing instead of building a default."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "building as $version"

  build-and-test:
    name: Build & Test
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # dorny/test-reporter publishes a check run
      checks: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Daedalus.sln

      - name: Build
        run: dotnet build Daedalus.sln --configuration Release --no-restore -p:Version="$APP_VERSION"

      - name: Run Unit Tests
        run: |
          dotnet test Daedalus.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName!~Playwright&FullyQualifiedName!~Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit \
            --logger "trx;LogFileName=unit-tests.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Run Integration Tests
        run: |
          dotnet test Daedalus.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~Integration&FullyQualifiedName!~Playwright" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Integration \
            --logger "trx;LogFileName=integration-tests.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"Cobertura;HtmlSummary;TextSummary;Badges" \
            -assemblyfilters:"-*.Tests*;-Daedalus.Benchmarks;-Daedalus.AppHost;-Daedalus.Migrations;-Daedalus.ServiceDefaults"

      - name: Extract Coverage Percentage
        id: coverage
        run: |
          SUMMARY=$(cat ./CoverageReport/Summary.txt)
          COVERAGE=$(echo "$SUMMARY" | grep -oP 'Line coverage: \K[\d.]+')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "### Code Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./CoverageReport/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 30

      # Only when the gist badge is configured (repository variable COVERAGE_GIST_ID + secret
      # GIST_TOKEN); an unconfigured badge must not turn CI red.
      - name: Update Coverage Badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: daedalus-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 0
          maxColorRange: 100

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: ./TestResults/**/*.trx
          reporter: dotnet-trx

  # Conventional commits, enforced mechanically — release-please derives release versions from
  # commit messages, so a malformed type is a commit the release tooling cannot read. Lints only the
  # commits a pull request adds, never the existing history. Rules: .commitlintrc.yml.
  # Escape hatch: the `skip-commitlint` label, for a pull request that imports history nobody can
  # rewrite (the one-time adoption of the local main, #236). Not for ordinary work.
  commitlint:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-commitlint')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint the commits this pull request adds
        run: >
          npx --yes --package @commitlint/cli@21.2.1 --package @commitlint/config-conventional@21.2.0
          commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Builds the three container images with the derived version stamped in (APP_VERSION build-arg →
  # -p:Version inside the Dockerfiles). On a push to main the images are pushed as <sha> and `main`
  # — the moving tip, never `latest`: `latest` is reserved for the newest release (publish-release
  # below). Pull requests only build. This is the rehearsal of the release job: the same Dockerfiles
  # and build args run green on every push, so the release only adds the version tags.
  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [version, build-and-test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: daedalus-api
            dockerfile: src/Daedalus.Api/Dockerfile
          - image: daedalus-console
            dockerfile: src/Daedalus.Console/Dockerfile
          - image: daedalus-web
            dockerfile: src/Daedalus.Web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # THE GATE: a manual workflow_dispatch on main or on a release tag with publish_release=true. Both
  # gating jobs must be green on this exact commit first, and the commit must be the one
  # release-please tagged (checked below) — no prereleases, and no unreleased commits under a
  # stable-looking number: ghcr.io only ever receives X.Y.Z / X.Y / latest tags from the tagged
  # release commit. Procedure: docs/release.md.
  publish-release:
    # No display name: a skipped matrix job renders `name:` unexpanded; the default
    # `publish-release (daedalus-api)` reads fine either way.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, build-and-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: daedalus-api
            dockerfile: src/Daedalus.Api/Dockerfile
          - image: daedalus-console
            dockerfile: src/Daedalus.Console/Dockerfile
          - image: daedalus-web
            dockerfile: src/Daedalus.Web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Main derives plain X.Y.Z for every commit (GitVersion.yml), so the version alone cannot tell
      # a release from the commit after it — the tag can. Both checks are stated even though the tag
      # check implies the first, so a failure reads as the rule that was broken.
      - name: Refuse anything that is not the tagged release commit
        shell: bash
        run: |
          if [[ "$APP_VERSION" == *-* ]]; then
            echo "::error::'$APP_VERSION' is a prerelease. This project releases stable versions only (docs/release.md)."
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -qx "v$APP_VERSION"; then
            echo "::error::HEAD is not tagged v$APP_VERSION. Only the release commit release-please tagged may be published — cut the release first (docs/release.md)."
            exit 1
          fi
          echo "publishing release v$APP_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.APP_VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ env.APP_VERSION }}

      # Same Dockerfile, same build arg as the docker job that ran green on this commit; the layer
      # cache makes this a re-tag in practice.
      - name: Build and push the release images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
